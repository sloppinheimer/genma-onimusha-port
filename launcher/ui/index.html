<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Genma Onimusha</title>
<style>
:root {
  --ink: #15120f;
  --ink-2: #1d1914;
  --paper: #e8ddc7;
  --paper-2: #a99d88;
  --paper-3: #8a8070;   /* about 4.6:1 on --ink (was #6c6356, 3.2:1: tab names, group headers, subtitles were hard to read) */
  --rule: rgba(232, 221, 199, .11);
  --red: #b5311e;
  --red-hi: #cc4430;
  --serif: "Yu Mincho", "YuMincho", "Hiragino Mincho ProN", Georgia, serif;
  --sans: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--ink); color: var(--paper); font: 14px/1.5 var(--sans); overflow: hidden; user-select: none; font-variant-numeric: tabular-nums; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
:focus { outline: none; }

.app { position: relative; height: 100%; }

/* ---- the painting ---- */
/* the painting fills the window; the menu sits over its darker left side */
.painting { position: absolute; inset: 0; background: #0e0c0a center / cover no-repeat; }
.painting .title-jp { position: absolute; left: 600px; right: 0; top: 0; bottom: 0; display: grid; place-items: center; writing-mode: vertical-rl;
  font: 600 64px/1 var(--serif); letter-spacing: .3em; color: var(--red); }
.painting .title-jp[hidden] { display: none; }

/* ---- the menu side ---- */
/* dark under the whole column (to 600px), then a soft fade into the painting */
.side { position: relative; display: flex; flex-direction: column; width: 780px; height: 100%; padding: 0 220px 0 44px;
  background: linear-gradient(90deg, rgba(21,18,15,.95) 0, rgba(21,18,15,.93) 600px, rgba(21,18,15,0) 100%); }
.titlebar { position: fixed; z-index: 5; top: 0; left: 0; right: 0; height: 34px; display: flex; justify-content: flex-end; }
.winbtn { width: 44px; height: 34px; display: grid; place-items: center; color: rgba(232,221,199,.85); filter: drop-shadow(0 0 1.5px rgba(0,0,0,.9)); }
.winbtn:hover { color: var(--paper); background: rgba(232,221,199,.06); }
.winbtn.close:hover { background: #a3241a; color: #fff; }
.winbtn svg { width: 10px; height: 10px; }
.winbtn.about svg { width: 13px; height: 13px; }
.winbtn.about.on { color: var(--paper); }
.winbtn.about { position: relative; }
/* an update is waiting: a red dot with a dark ring (it sits on the art), pulsing a few times when it appears */
.winbtn.about.dot::after { content: ""; position: absolute; top: 4px; right: 7px; width: 9px; height: 9px; border-radius: 50%;
  background: var(--red-hi); box-shadow: 0 0 0 2px rgba(10,8,6,.7); animation: badge 1.4s ease-out 3; }
@keyframes badge { 0% { box-shadow: 0 0 0 2px rgba(10,8,6,.7), 0 0 0 0 rgba(204,68,48,.8); }
  70% { box-shadow: 0 0 0 2px rgba(10,8,6,.7), 0 0 0 8px rgba(204,68,48,0); } 100% { box-shadow: 0 0 0 2px rgba(10,8,6,.7), 0 0 0 0 rgba(204,68,48,0); } }
/* the title texture at 1/3 size (1024x768 -> 340x255): the logo's letters reach 144px down and its glow 158px. The
   texture's TM mark (x 37-48, y 140-146 here) is covered in black, which the screen blend makes transparent. */
.logo { position: relative; width: 292px; height: 162px; margin: 40px auto 4px; background: no-repeat; background-size: 340px 255px; background-position: -24px -4px; mix-blend-mode: screen;
  -webkit-mask-image: linear-gradient(#000 88%, transparent); }
.logo::after { content: ""; position: absolute; left: 34px; top: 137px; width: 18px; height: 12px; background: #000; }
.logo-text { margin: 52px 0 30px; font: 600 34px/1.1 var(--serif); letter-spacing: .02em; }
.logo-text small { display: block; font-size: 15px; color: var(--paper-2); letter-spacing: .04em; margin-bottom: 4px; }

nav { display: flex; justify-content: space-between; border-bottom: 1px solid var(--rule); }
nav button { position: relative; padding: 10px 0 11px; font: 600 15px/1 var(--serif); color: var(--paper-3); }
nav button:hover { color: var(--paper-2); }
nav button[aria-current="page"] { color: var(--paper); }
nav button.dot::before { content: ""; position: absolute; right: -9px; top: 7px; width: 5px; height: 5px; border-radius: 50%; background: var(--red-hi); }
nav button[aria-current="page"]::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--red); }

.list { flex: 1; min-height: 0; overflow-y: auto; margin: 0 -12px; padding: 10px 12px 12px; scrollbar-width: thin; scrollbar-color: rgba(232,221,199,.18) transparent; }
.intro { color: var(--paper-2); margin: 6px 0 12px; max-width: 470px; }
.row { position: relative; display: flex; align-items: center; height: 36px; padding: 0 10px; margin: 0 -10px; cursor: default; }
.row + .row { box-shadow: 0 -1px 0 var(--rule); }
.row .label { flex: 1; color: var(--paper-2); }
.row .value { display: flex; align-items: center; gap: 2px; color: var(--paper); }
.row .value .v { min-width: 112px; text-align: center; cursor: pointer; }
.row .value .v small { color: var(--paper-3); margin-left: 6px; }
.arrow { width: 22px; height: 26px; display: grid; place-items: center; color: var(--paper-3); visibility: hidden; }
.arrow:hover { color: var(--paper); }
.arrow svg { width: 7px; height: 11px; }
.arrow[disabled] { opacity: .3; cursor: default; }
.row.focus { background: var(--ink-2); }
.row.focus::before { content: ""; position: absolute; left: 0; top: 7px; bottom: 7px; width: 2px; background: var(--red); }
.row.focus .label { color: var(--paper); }
.row.focus .arrow { visibility: visible; }
.row.dim .label, .row.dim .value { color: var(--paper-3); }
.row.dim .arrow { visibility: hidden; }
.row.action .v { min-width: 0; padding: 0 2px; }
.row.action.focus .v { color: #fff; }
.row .glyph { display: inline-block; width: 22px; font-weight: 700; }
.listening .v { color: var(--red-hi); }
.danger .v { color: #e0806f; }
.back { display: inline-flex; align-items: center; gap: 7px; margin: 2px 0 10px; color: var(--paper-3); font: 600 14px/1 var(--serif); }
.back:hover { color: var(--paper); }
.back svg { width: 7px; height: 11px; }
.gap { height: 18px; }
.field { width: 190px; height: 28px; padding: 0 10px; color: var(--paper); font: inherit; font-size: 14px; text-align: right; border: 1px solid var(--rule); background: var(--ink-2); outline: none; }
.field::placeholder { color: var(--paper-3); }
.field:focus { border-color: var(--paper-3); }
/* Randomizer: the Normal game | Randomizer switch, a card per run, the new run's options in an empty slot */
.row.seg, .row + .row.seg { justify-content: center; height: 46px; margin: 10px 0 8px; padding: 0; box-shadow: none; background: none; }
.row.seg::before { display: none; }
/* Normal game | Randomizer: a thumb slides under the chosen side (render() moves it a frame after drawing) */
.segs { position: relative; width: 360px; display: flex; padding: 3px; gap: 3px; background: rgba(29,25,20,.9); box-shadow: inset 0 0 0 1px var(--rule); }
.segs .thumb { position: absolute; top: 3px; bottom: 3px; left: 3px; width: calc(50% - 4.5px); background: rgba(232,221,199,.08); box-shadow: inset 0 0 0 1px var(--paper-3);
  transition: transform .28s cubic-bezier(.3, .7, .2, 1), background-color .28s, box-shadow .28s; }
.segs .thumb.r { transform: translateX(calc(100% + 3px)); background: rgba(201,162,74,.14); box-shadow: inset 0 0 0 1px #c9a24a; }
.segs button { position: relative; flex: 1; height: 34px; font: 600 14px/1 var(--serif); color: var(--paper-3); transition: color .28s; }
.segs button:hover { color: var(--paper-2); }
.segs button.sel { color: var(--paper); }
.segs button.sel.r { color: #f0d27a; }
.row.seg.focus .segs { box-shadow: inset 0 0 0 1px var(--paper-3); }
.row.rcard, .row + .row.rcard { display: block; height: auto; margin: 0 0 8px; padding: 12px 16px 12px 44px; background: rgba(29,25,20,.55); box-shadow: inset 0 0 0 1px var(--rule); cursor: pointer; }
.row.rcard.idle { opacity: .78; }
.row.rcard.idle.focus, .row.rcard.idle:hover { opacity: .85; }
.row.rcard.focus { background: rgba(37,31,25,.97); box-shadow: inset 0 0 0 1px var(--paper-3); }
.row.rcard.on, .row + .row.rcard.on { box-shadow: inset 0 0 0 2px #c9a24a; }
.row.rcard::before { display: none; }
.rc-dot { position: absolute; left: 16px; top: 16px; width: 14px; height: 14px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px var(--paper-3); }
.rc-dot.chosen { box-shadow: inset 0 0 0 1.5px #c9a24a; background: radial-gradient(#e0b85a 0 3.5px, transparent 4px); }
.rc-head { display: flex; align-items: baseline; gap: 10px; }
.rc-head b { font: 600 18px/1.25 var(--serif); color: var(--paper); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rc-tag { margin-left: auto; flex: none; font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: #e0b85a; }
.rc-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 4px; color: var(--paper-2); font-size: 13px; }
.rc-meta i { font-style: normal; padding: 1px 7px; font-size: 11.5px; color: var(--paper-2); box-shadow: inset 0 0 0 1px var(--rule); }
.rc-meta i.x { color: #e0b85a; box-shadow: inset 0 0 0 1px rgba(201,162,74,.45); }
.rc-prog { display: flex; align-items: center; gap: 10px; margin-top: 10px; font-size: 12.5px; color: var(--paper-2); }
.rc-prog .bar { flex: 1; height: 4px; background: var(--rule); }
.rc-prog .bar i { display: block; height: 100%; background: #c9a24a; }
.rc-foot { display: flex; align-items: center; min-height: 26px; margin-top: 8px; color: var(--paper-3); font-size: 12.5px; }
.rc-btns { margin-left: auto; display: flex; gap: 6px; }
.rc-btns button { height: 26px; padding: 0 10px; font-size: 12.5px; color: var(--paper-3); box-shadow: inset 0 0 0 1px var(--rule); }
.rcard.focus .rc-btns button, .rcard:hover .rc-btns button { color: var(--paper-2); }
.rc-btns button:hover, .rc-btns button.sel { color: var(--paper) !important; box-shadow: inset 0 0 0 1px var(--paper-3); }
.rc-btns button.sel { background: rgba(232,221,199,.06); }
.rc-btns button.danger { color: #c97a6a; }
.rc-btns button.danger.sel { color: #fff6ea !important; background: var(--red); box-shadow: none; }
.row.rcard.empty, .row + .row.rcard.empty { display: flex; align-items: center; gap: 10px; height: 54px; padding: 0 16px; background: none; box-shadow: none;
  outline: 1px dashed rgba(232,221,199,.2); outline-offset: -1px; color: var(--paper-3); font: 600 15px/1 var(--serif); opacity: 1; }
.row.rcard.empty.focus, .row.rcard.empty:hover { outline-color: var(--paper-3); color: var(--paper); background: rgba(29,25,20,.55); }
.rc-plus { font: 400 22px/1 var(--sans); width: 18px; text-align: center; }
.row.rcard.making, .row + .row.rcard.making { cursor: default; opacity: 1; box-shadow: inset 0 0 0 1px rgba(201,162,74,.45); }
.rc-spin { position: absolute; left: 15px; top: 15px; width: 16px; height: 16px; border-radius: 50%; border: 2px solid rgba(201,162,74,.25); border-top-color: #e0b85a; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.rc-sweep { height: 3px; margin-top: 12px; background: linear-gradient(90deg, transparent, #c9a24a, transparent) 0 0 / 40% 100% no-repeat, var(--rule); animation: sweep 1.4s ease-in-out infinite; }
@keyframes sweep { from { background-position: -40% 0, 0 0; } to { background-position: 140% 0, 0 0; } }
/* a new run's options, open in an empty slot: name and seed, the options as two columns of switches, then Create */
.nr-box { margin: 0 0 8px; padding: 0 0 12px; background: rgba(37,31,25,.97); box-shadow: inset 0 0 0 1px var(--paper-3); }
.nr-head { display: flex; align-items: baseline; justify-content: space-between; padding: 12px 16px 6px; background: rgba(37,31,25,.97);
  box-shadow: inset 0 1px 0 var(--paper-3), inset 1px 0 0 var(--paper-3), inset -1px 0 0 var(--paper-3); font: 600 18px/1.25 var(--serif); }
.nr-head span { font: 12px/1 var(--sans); color: var(--paper-3); }
.row.nr, .row + .row.nr { margin: 0; padding: 0 16px; background: rgba(37,31,25,.97); box-shadow: inset 1px 0 0 var(--paper-3), inset -1px 0 0 var(--paper-3); }
.row.nr.focus { background: rgba(52,44,35,.98); }
.row.nr .label { flex: none; width: 70px; }
.row.nr .value { flex: 1; }
.row.nr .field { flex: 1; width: auto; text-align: left; }
.dice { width: 30px; height: 28px; margin-left: 6px; display: grid; place-items: center; color: var(--paper-2); box-shadow: inset 0 0 0 1px var(--rule); }
.dice:hover { color: var(--paper); box-shadow: inset 0 0 0 1px var(--paper-3); }
.dice svg { width: 16px; height: 16px; }
.row.chip, .row + .row.chip { display: inline-flex; vertical-align: top; align-items: flex-start; gap: 10px; width: 50%; height: 70px; padding: 10px 10px 0 16px; cursor: pointer;
  box-shadow: inset 1px 0 0 var(--paper-3); }
.row.chip.even, .row + .row.chip.even { padding: 10px 16px 0 6px; box-shadow: inset -1px 0 0 var(--paper-3); }
.row.chip::before { display: none; }
.chip .box { flex: none; width: 16px; height: 16px; margin-top: 2px; display: grid; place-items: center; box-shadow: inset 0 0 0 1.5px var(--paper-3); }
.chip.on .box { background: #c9a24a; box-shadow: none; }
.chip .box svg { width: 10px; height: 10px; visibility: hidden; }
.chip.on .box svg { visibility: visible; }
.chip .t { min-width: 0; }
.chip .t b { font-weight: 600; color: var(--paper-2); }
.chip.on .t b, .chip.focus .t b { color: var(--paper); }
.chip .t em { margin-left: 6px; font-style: normal; font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: #e0b85a; }
.chip .t small { display: block; margin-top: 2px; font-size: 12px; line-height: 1.3; color: var(--paper-3); }
.row.chip.focus { background: rgba(52,44,35,.98); }
.row.chip.focus .box { box-shadow: inset 0 0 0 1.5px var(--paper); }
.row.chip.on.focus .box { box-shadow: inset 0 0 0 1.5px #f0d27a; }
.row.nrbtn, .row + .row.nrbtn { display: inline-flex; width: 50%; height: 52px; padding: 10px 6px 6px 16px; }
.row.nrbtn.even, .row + .row.nrbtn.even { padding: 10px 16px 6px 6px; }
.row.nrbtn::before { display: none; }
.row.nrbtn.focus { background: rgba(37,31,25,.97); }   /* the button shows the focus, not the cell around it */
.nrbtn .b { flex: 1; height: 36px; display: grid; place-items: center; font: 600 15px/1 var(--serif); color: var(--paper-2); box-shadow: inset 0 0 0 1px var(--paper-3); cursor: pointer; }
.nrbtn.primary .b { background: #9a6f1c; color: #fff6ea; box-shadow: none; }
.nrbtn.focus .b { color: var(--paper); box-shadow: inset 0 0 0 2px var(--paper-2); }
.nrbtn.primary.focus .b { background: #b0821f; box-shadow: inset 0 0 0 2px #f0d27a; }
.row.nrbtn.last, .row + .row.nrbtn.last { margin-bottom: 8px; box-shadow: inset -1px 0 0 var(--paper-3), inset 0 -1px 0 var(--paper-3); }
.row.nrbtn.first, .row + .row.nrbtn.first { box-shadow: inset 1px 0 0 var(--paper-3), inset 0 -1px 0 var(--paper-3); }

.info { margin: 8px 0 14px; }
.info b { display: block; font: 600 19px/1.3 var(--serif); }
.info p { margin: 6px 0 0; color: var(--paper-2); max-width: 470px; }
.info .error { color: #e0806f; }
.meter { margin: 18px 0 8px; }
.meter .n { font: 600 40px/1 var(--serif); }
.meter .n small { font-size: 18px; color: var(--paper-2); margin-left: 3px; }
.meter .track { height: 3px; background: var(--rule); margin: 14px 0 9px; }
.meter .track i { display: block; height: 100%; background: var(--red); transition: width .2s linear; }
.meter .m { display: flex; justify-content: space-between; gap: 20px; color: var(--paper-3); font-size: 12.5px; }
.meter .m span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row.ach { height: 52px; }
.row.ach .label b { display: block; font-weight: 600; color: var(--paper); }
.row.ach .label small { display: block; color: var(--paper-3); font-size: 12.5px; margin-top: 2px; }
.row.ach.locked .label b { color: var(--paper-2); }
.row.ach .value .v { min-width: 0; color: var(--paper-3); font-size: 12.5px; }
.row.ach.unlocked .value .v { color: #e8b850; }
.legal { margin-top: 18px; color: var(--paper-3); font-size: 12px; max-width: 470px; }
.legal p { margin: 0 0 6px; }

/* ---- Mods: the list sits in the usual column; the selected mod's card sits on the right, over the painting ---- */
body.mods .list { display: flex; flex-direction: column; overflow: hidden; padding-bottom: 0; }
.mm-bar { display: flex; align-items: center; gap: 8px; padding: 2px 0 10px; }
.mm-search { flex: 1; min-width: 0; position: relative; }
.mm-search small { position: absolute; right: 10px; top: 8px; color: var(--paper-3); font-size: 12px; pointer-events: none; }
.mm-filter:not(:placeholder-shown) + small { display: none; }
.mm-filter { width: 100%; height: 30px; padding: 0 110px 0 30px; color: var(--paper); font: inherit; font-size: 13px; border: 1px solid var(--rule); background: var(--ink-2)
  url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' fill='none' stroke='%236c6356' stroke-width='1.5'><circle cx='6' cy='6' r='4.5'/><path d='M9.5 9.5l3.5 3.5'/></svg>") 9px 8px no-repeat; }
.mm-filter::placeholder { color: var(--paper-3); }
.mm-filter:focus { border-color: var(--paper-3); }
.mm-btn { height: 30px; padding: 0 12px; font-size: 13px; color: var(--paper-2); box-shadow: inset 0 0 0 1px var(--rule); white-space: nowrap; }
.mm-btn + .mm-switch { margin-left: 12px; }   /* an installed pack with an update out: Update, then its on/off switch */
.mm-btn:hover { color: var(--paper); box-shadow: inset 0 0 0 1px var(--paper-3); }
.mm-btn.icon { width: 30px; padding: 0; display: grid; place-items: center; }
.mm-btn.icon svg { width: 15px; height: 13px; }
.mm-btn.danger { color: #e0806f; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
.ob-note { margin: 0 0 14px; }
.mm-btn.sel { color: var(--paper); background: rgba(232,221,199,.06); box-shadow: inset 0 0 0 1px var(--paper-3); }   /* picked with Left/Right */
.mm-btn.danger.sel { color: #fff6ea; background: var(--red); box-shadow: none; }
.mm-list { flex: 1; min-height: 0; overflow-y: auto; margin: 0 -12px; padding: 0 12px 10px; scrollbar-width: thin; scrollbar-color: rgba(232,221,199,.18) transparent; }
.mm-group { display: flex; justify-content: space-between; align-items: baseline; padding: 12px 0 5px; font: 600 12.5px/1 var(--serif); color: var(--paper-3); }
.mm-group span { font: 11.5px/1 var(--sans); }
.row.mm-row { height: 50px; gap: 10px; }
.mm-row .grip { width: 8px; height: 16px; color: var(--paper-3); opacity: 0; cursor: grab; flex: none; }
.mm-row:hover .grip, .mm-row.focus .grip { opacity: .7; }
.mm-ord { width: 14px; text-align: right; color: var(--paper-3); font-size: 12px; flex: none; }
.mm-thumb { width: 36px; height: 36px; flex: none; display: grid; place-items: center; overflow: hidden; background: var(--th, #2a241d) center / cover no-repeat;
  font: 600 17px/1 var(--serif); color: rgba(232,221,199,.85); box-shadow: inset 0 0 0 1px rgba(232,221,199,.08); }
.mm-thumb.builtin { background: #4a1d14; color: #f0d8c8; }
.mm-text { flex: 1; min-width: 0; }
.mm-text b { display: block; font-weight: 600; color: var(--paper); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mm-text small { display: block; margin-top: 1px; color: var(--paper-3); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mm-row.off .mm-text b { color: var(--paper-3); }
.mm-row.off .mm-thumb { filter: grayscale(1) brightness(.6); }
.mm-switch { width: 34px; height: 18px; flex: none; position: relative; background: #2a241e; box-shadow: inset 0 0 0 1px var(--paper-3); transition: background .22s, box-shadow .22s; }
.mm-switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 12px; height: 12px; background: var(--paper-2); transition: transform .22s cubic-bezier(.3, .7, .2, 1), background .22s; }
.mm-switch[aria-pressed="true"] { background: var(--red); box-shadow: none; }
.mm-switch[aria-pressed="true"]::after { transform: translateX(16px); background: #fff6ea; }
.mm-row.drop-above { box-shadow: inset 0 2px 0 var(--red-hi) !important; }
.mm-row.drop-below { box-shadow: inset 0 -2px 0 var(--red-hi) !important; }
.mm-empty { padding: 14px 0; color: var(--paper-2); }
.mm-empty p { margin: 0 0 12px; }
.mm-card { position: fixed; z-index: 2; left: 704px; right: 44px; top: 255px; max-height: calc(100% - 367px); display: none; overflow-y: auto; background: rgba(21,18,15,.9);
  box-shadow: inset 0 0 0 1px var(--rule); scrollbar-width: thin; scrollbar-color: rgba(232,221,199,.18) transparent; }
body.mods .mm-card { display: block; }
.mm-card .hero { aspect-ratio: 16 / 9; background: #2a241d center / cover no-repeat; }
.mm-card .body { padding: 16px 18px 18px; }
.mm-card h3 { margin: 0 0 2px; font: 600 20px/1.25 var(--serif); }
.mm-meta { margin: 0; color: var(--paper-3); font-size: 12.5px; }
.mm-desc { margin: 10px 0 0; color: var(--paper-2); }
.mm-facts { display: grid; grid-template-columns: 84px 1fr; gap: 4px 12px; margin: 14px 0 0; font-size: 12.5px; }
.mm-facts dt { color: var(--paper-3); }
.mm-facts dd { margin: 0; color: var(--paper-2); word-break: break-word; user-select: text; }
.mm-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }

/* ---- first run: install the game, then choose a style (centred, no tabs) ---- */
body.onboard nav, body.onboard footer, body.onboard .logo, body.onboard .logo-text, body.onboard .painting .title-jp { display: none !important; }
body.onboard .side { width: 100%; padding: 0 44px; align-items: center; justify-content: center; background: rgba(21,18,15,.84); }
body.onboard .list { flex: none; width: 680px; overflow: visible; margin: 0; padding: 0; }
.ob-steps { display: flex; gap: 26px; margin-bottom: 34px; font-size: 12.5px; color: var(--paper-3); }
.ob-steps span::before { content: attr(data-n); display: inline-grid; place-items: center; width: 20px; height: 20px; margin-right: 9px; box-shadow: inset 0 0 0 1px var(--paper-3); font-size: 11px; }
.ob-steps .on { color: var(--paper); }
.ob-steps .on::before { background: var(--red); box-shadow: none; color: #fff6ea; }
.ob-steps .done::before { content: "✓"; color: var(--paper-2); }
.ob h1 { margin: 0; font: 600 40px/1.1 var(--serif); }
.ob-sub { margin: 10px 0 28px; color: var(--paper-2); font-size: 15px; }
.ob-needs { list-style: none; margin: 0 0 30px; padding: 0; border-top: 1px solid var(--rule); }
.ob-needs li { display: flex; gap: 24px; padding: 11px 0; border-bottom: 1px solid var(--rule); color: var(--paper-2); }
.ob-needs li b { width: 120px; flex: none; color: var(--paper-3); font-weight: 400; }
.row.ob-primary { display: inline-flex; height: 50px; margin: 0; padding: 0 30px; background: var(--red); color: #fff6ea; font: 600 17px/1 var(--serif); letter-spacing: .03em; cursor: pointer; }
.row.ob-primary:hover, .row.ob-primary.focus { background: var(--red-hi); }
.row.ob-primary.focus::before, .row.ob-card.focus::before, .row.ob-later.focus::before { display: none; }
.ob .error { margin: 16px 0 0; color: #e0806f; }
.ob-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.row.ob-card { display: block; height: auto; margin: 0; padding: 22px 22px 20px; background: rgba(29,25,20,.94); box-shadow: inset 0 0 0 1px var(--rule); cursor: pointer; }
.row.ob-card.focus { background: rgba(37,31,25,.97); box-shadow: inset 0 0 0 2px var(--red); }
.ob-card h2 { margin: 0; font: 600 26px/1.15 var(--serif); }
.ob-card .tag { margin: 6px 0 16px; color: var(--paper-2); }
.ob-card ul { margin: 0 0 20px; padding: 0; list-style: none; font-size: 13px; color: var(--paper-2); }
.ob-card li { padding: 6px 0; border-top: 1px solid var(--rule); }
.ob-card .go { display: inline-block; padding: 9px 16px; font-weight: 600; font-size: 13px; color: var(--paper-2); box-shadow: inset 0 0 0 1px var(--paper-3); }
.ob-card.focus .go { background: var(--red); color: #fff6ea; box-shadow: none; }
.row.ob-later { display: inline-flex; height: 34px; margin: 18px 0 0; padding: 0; color: var(--paper-3); cursor: pointer; }
.row.ob-later.focus, .row.ob-later:hover { color: var(--paper); background: none; }
.ob-picks { margin: 0 0 26px; border-top: 1px solid var(--rule); }
.row.ob-pick { display: flex; align-items: center; gap: 16px; height: auto; margin: 0; padding: 13px 14px; border-bottom: 1px solid var(--rule); cursor: pointer; }
.ob-pick .mm-text { flex: 1; }
.ob-pick .mm-text b { display: block; font-weight: 600; }
.ob-pick .mm-text small { color: var(--paper-3); }
.ob-pick .size { color: var(--paper-2); font-size: 13px; }
.ob-go { display: flex; align-items: center; gap: 28px; }
.ob-go .row.ob-later { margin: 0; box-shadow: none; }

footer { display: flex; align-items: center; gap: 24px; height: 92px; border-top: 1px solid var(--rule); }
.help { flex: 1; min-width: 0; color: var(--paper-2); font-size: 13px; line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.help.note { color: var(--paper); }
.playbox { flex: none; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.playtime { color: var(--paper-2); font-size: 12px; white-space: nowrap; }
.playtime:empty { display: none; }
.play { flex: none; width: 168px; height: 50px; background: var(--red); color: #fff6ea; font: 600 19px/1 var(--serif); letter-spacing: .08em; transition: background .12s; }
.play:hover { background: var(--red-hi); }
.play:active { background: #9c2818; }
.play[disabled] { background: none; color: var(--paper-3); box-shadow: inset 0 0 0 1px var(--rule); cursor: default; }
.play.rando { background: rgba(201,162,74,.1); color: #f0d27a; box-shadow: inset 0 0 0 2px #c9a24a; line-height: 1.05; }
.play.rando:hover { background: rgba(201,162,74,.2); }
.play small { display: block; margin-top: 3px; font: 12px/1.2 var(--sans); letter-spacing: 0; color: var(--paper-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 10px; }
.play.dl { font: 600 13px/1.3 var(--sans); letter-spacing: 0; color: var(--paper-2); background: linear-gradient(90deg, rgba(185,64,40,.35) var(--p), transparent var(--p)); }
</style>
</head>
<body>
<div class="app">
  <div class="painting" id="painting"><div class="title-jp" id="title-jp" hidden>幻魔鬼武者</div></div>
  <div class="side">
    <div class="titlebar" id="titlebar">
      <button class="winbtn about" id="about" title="About, updates and settings reset"><svg viewBox="0 0 10 10"><circle cx="5" cy="5" r="4.4" fill="none" stroke="currentColor"/><path d="M5 4.2v3.3" stroke="currentColor"/><circle cx="5" cy="2.6" r=".55" fill="currentColor"/></svg></button>
      <button class="winbtn" data-act="min" title="Minimize"><svg viewBox="0 0 10 10"><path d="M0 5.5h10" stroke="currentColor"/></svg></button>
      <button class="winbtn close" data-act="close" title="Close"><svg viewBox="0 0 10 10"><path d="M.5 .5l9 9M9.5 .5l-9 9" stroke="currentColor"/></svg></button>
    </div>
    <div class="logo" id="logo" hidden></div>
    <div class="logo-text" id="logo-text"><small>Genma</small>Onimusha</div>
    <nav id="nav"></nav>
    <div class="list" id="list"></div>
    <div class="mm-card" id="mm-card"></div>
    <footer><div class="help" id="help"></div><div class="playbox"><button class="play" id="play">Play</button><div class="playtime" id="playtime"></div></div></footer>
  </div>
</div>

<script>
"use strict";
const $ = s => document.querySelector(s);
const host = window.chrome && window.chrome.webview;
const send = msg => host ? host.postMessage(msg) : mock(msg);
let S = null;              // state from the host
let page = "game";
let focus = {};            // focused row per page
let listening = null;      // key being rebound
let confirmReset = false;
let confirmDelete = null;   // the randomizer run waiting for a second press to delete
let seedText = "";   // the Randomizer page's seed box
let cardSub = {};   // the button picked in a run card ({page, name, k}; k -1: the card itself)
let newSlot = -1, focusSeed = false, formTop = false, nameText = "", focusKey = "";
// the Randomizer side of Play: onimusha.ini randomizer_on (launcher only); before it existed, a run named meant on
const randoOn = () => S.s.randomizer_on !== undefined && S.s.randomizer_on !== "" ? !!+S.s.randomizer_on : !!S.s.randomizer_run;   // the Randomizer slot showing a new run's options; move to its seed box
let confirmCheat = null;   // the cheat waiting for a second press: turning on the first one ends achievements
let note = "", noteT;      // a passing message in the help line
const esc = t => String(t).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

// ---- keyboard names, as onimusha.ini spells them ----
const BUTTONS = [
  ["a", "A", "#6fbf5c"], ["b", "B", "#e0604f"], ["x", "X", "#5b9be6"], ["y", "Y", "#e3c04a"],
  ["white", "White", null, "LB on a PC controller"], ["black", "Black", null, "RB on a PC controller"],
  ["left_trigger", "Left trigger"], ["right_trigger", "Right trigger"],
  ["up", "D-pad up"], ["down", "D-pad down"], ["left", "D-pad left"], ["right", "D-pad right"],
  ["start", "Start"], ["back", "Back"],
];
const DEFAULT_KEYS = { up: "Up", down: "Down", left: "Left", right: "Right", start: "Enter", back: "Backspace", a: "Z", b: "X", x: "A", y: "S", white: "C", black: "D", left_trigger: "Q", right_trigger: "W" };
function keyName(e) {
  const c = e.code;
  if (/^Key[A-Z]$/.test(c)) return c.slice(3);
  if (/^Digit\d$/.test(c)) return c.slice(5);
  if (/^(Numpad\d|F([1-9]|10))$/.test(c)) return c;
  const m = { ArrowUp: "Up", ArrowDown: "Down", ArrowLeft: "Left", ArrowRight: "Right", Enter: "Enter", NumpadEnter: "Enter", Space: "Space", Backspace: "Backspace", Tab: "Tab",
              ShiftLeft: "Shift", ShiftRight: "Shift", ControlLeft: "Ctrl", ControlRight: "Ctrl", AltLeft: "Alt", AltRight: "Alt" };
  return m[c] || (e.keyCode ? "0x" + e.keyCode.toString(16).toUpperCase().padStart(2, "0") : null);
}
const keyLabel = k => ({ Up: "Up arrow", Down: "Down arrow", Left: "Left arrow", Right: "Right arrow" })[k] || k;

// ---- rows ----
// An option row steps through choices; an action row does one thing.
function set(key, value) {
  S.s[key] = value;
  if (key === "window_size") [S.s.window_width, S.s.window_height] = String(value).split("x");   // what render() shows it from
  send({ type: "set", key, value: String(value) });
}
function opt(key, label, choices, help, extra = {}) {
  const i = Math.max(0, choices.findIndex(c => String(c[0]) === String(S.s[key])));
  return Object.assign({ label, help, choices, i, text: choices[i][1], sub: choices[i][2],
    step: d => { const j = i + d; if (j >= 0 && j < choices.length) set(key, choices[j][0]); },
    act: () => set(key, choices[(i + 1) % choices.length][0]) }, extra);
}
const onOff = [[0, "Off"], [1, "On"]];
const action = (label, text, help, act, extra = {}) => Object.assign({ label, text, help, act, action: true }, extra);

// onimusha.ini [cheats]: key, name, what it does
const CHEATS = [
  ["god_mode", "God mode", "Samanosuke and Kaede take no damage from enemies or traps."],
  ["infinite_magic", "Infinite magic", "The three orbs' magic stays full."],
  ["infinite_souls", "Unlimited red souls", "Red souls stay at 999,999, to power up swords and orbs at a Magic Mirror."],
  ["one_hit_kill", "One-hit kill", "Any hit kills an enemy."],
  ["infinite_ammo", "Infinite ammo", "The arrows and bullets you carry stay at 99."],
  ["infinite_items", "Infinite items", "The Herbs and Medicine you carry stay at 99."],
  ["infinite_onimusha", "Onimusha refill", "The green souls refill as soon as the Onimusha form ends, so you can transform again straight away."],
  ["vision_staff", "Vision Staff effect", "Hidden Fluorite sparkles on the ground, as if you held the Vision Staff. Shows from the next room you enter."],
];
const cheating = () => CHEATS.some(c => +S.s[c[0]]);
function cheatRow([key, label, about]) {
  const on = +S.s[key], ask = confirmCheat === key;
  const flip = () => {
    if (!on && !cheating() && !ask) { confirmCheat = key; render(); return; }   // the first one: press again
    confirmCheat = null; set(key, on ? 0 : 1); render();
  };
  return Object.assign(opt(key, label, onOff, ask ? "Press again to turn it on. No achievements unlock while a cheat is on, and saves you make are marked as cheated." : about),
    ask ? { text: "Confirm", cls: "danger" } : {}, { act: flip, step: d => { if ((d > 0) !== !!on) flip(); } });
}

function recScale() { const h = S.monitor ? S.monitor.h : 1080; for (let s = 1; s <= 8; s++) if (480 * s >= h) return s; return 8; }

const PAGES = {
  display: { name: "Video", rows: () => {
    // V-Sync, texture filtering, FXAA, noise cleanup and Enhanced backgrounds are onimusha.ini only: the defaults are
    // right for nearly everyone, and the frame pacing or a texture pack takes most of them over anyway.
    // only HD backgrounds take the row over (drawn as they are); a mod with other textures leaves it alone
    const s = S.s, rec = recScale(), m = S.monitor, pack = (S.mods || []).find(x => x.on && x.textures && /background/i.test(x.name));
    const scales = [1, 2, 3, 4, 5, 6, 7, 8].map(n => [n, n + "×", `${640 * n} × ${480 * n}`]);
    return [
      opt("scale", "Resolution", scales, `Characters, effects and text are drawn at this size. ${m ? `${rec}× fills your ${m.w} × ${m.h} screen; higher adds smoothing at more GPU cost.` : ""}`),
      opt("window", "Mode", [["windowed", "Window"], ["borderless", "Fullscreen"]], "Fullscreen is a borderless window, so alt-tab is instant. Alt+Enter or F11 switches while playing."),
      opt("window_size", "Window size", [["960x720", "960 × 720"], ["1280x960", "1280 × 960"], ["1600x1200", "1600 × 1200"], ["1920x1440", "1920 × 1440"]],
        s.window === "windowed" ? "Starting size of the window. The picture keeps the original 4:3 shape." : "Used in window mode only.", { dim: s.window !== "windowed" }),
      opt("picture", "Picture", [["original", "4:3"], ["modern", "Modern"], ["stretch", "Stretch"], ["zoom", "Zoom"]], {
        original: "The original 4:3 picture, with black bars on a wider screen.",
        modern: "Fills a wide screen like the 2019 remaster: the view follows Samanosuke up and down, and the health bar sits in the corner. Full-screen menus stay 4:3.",
        stretch: "Fills a wide screen by stretching: no bars, but everything looks wider.",
        zoom: "Fills a wide screen by cutting off the top and bottom. The edge of the health orb may be cut." }[s.picture] || ""),
      opt("frame_interpolation", "Frame rate", [[0, "60", "original"], [2, "120"], [4, "240"]],
        `The game runs at 60 steps a second. 120 and 240 draw blended frames in between: smoother motion, about 17 ms more input delay.${m ? ` Your display runs at ${m.hz} Hz.` : ""}`),
      opt("msaa", "Anti-aliasing", [[0, "Off"], [2, "2×"], [4, "4×"], [8, "8×"]], "Smooths the edges of characters and 3D objects."),
      opt("background_filter", "Backgrounds", [["smooth", "Smooth"], ["sharp", "Sharp"]],
        { smooth: "Smooth: soft and clean. The painted art is soft to begin with, so this is usually best.",
            sharp: "Sharp: every original pixel stays a crisp square. A retro look." }[s.background_filter] || "",
        pack ? { dim: true, text: "HD backgrounds", sub: "" } : {}),   // the pack's HD backgrounds are drawn as they are
      opt("hud_filter", "Menus and text", [["pixel", "Pixel"], ["xbr", "Smooth"]], "Pixel keeps the original look. Smooth redraws curves and diagonals so text isn't blocky."),
      opt("enhanced_text", "Enhanced text", onOff, +s.scale < 2 ? "Needs a resolution of 2× or more."
        : "Redraws menu and message text sharp at your resolution, in a font matched to the original letters. Off keeps the original letters.", { dim: +s.scale < 2 }),
      opt("show_fps", "FPS counter", onOff, "Shows the frame rate in the top-left corner while you play, and the game's own rate when frame interpolation draws more."),
    ];
  } },
  controls: { name: "Controls", rows: () => [
    { back: "Game" },
    { intro: S.controller ? `A controller is connected and works with ${+S.s.modern_controls ? "the remaster's layout (Modern controls, on the Mods page)" : "the original layout"}. Below are the keyboard keys for each button.` : "No controller found; plug one in any time. Below are the keyboard keys for each button." },
    ...BUTTONS.map(([k, name, color, sub]) => ({
      label: color ? `<span class="glyph" style="color:${color}">${name}</span>` : name, html: true,
      text: listening === k ? "Press a key" : keyLabel(S.keys[k]), action: true, cls: listening === k ? "listening" : "",
      help: listening === k ? "Press the new key. Esc cancels." : `${sub ? sub + ". " : ""}Enter or click, then press the new key.`,
      act: () => { listening = listening === k ? null : k; render(); } })),
    { html: `<div class="gap"></div>` },
    action("Restore default keys", "Restore", "Puts every key back to how it started.", () => {
      for (const k in DEFAULT_KEYS) { S.keys[k] = DEFAULT_KEYS[k]; send({ type: "key", action: k, key: DEFAULT_KEYS[k] }); }
      say("Default keys restored");
    }, { cls: "danger" }),
  ] },
  mods: { name: "Mods", select: true, rows: modRows, view: modView },
  game: { name: "Game", rows: () => {
    const st = S.setup || {};
    if (st.busy) return [{ html: meter(st) }];
    if (!st.ready) return [
      { html: `<div class="info"><b>Your copy of the game</b><p>This port runs Genma Onimusha for the original Xbox (USA) from your own disc image. Its files are copied next to the launcher, about 5 GB. Nothing is downloaded.</p>${S.setupError ? `<p class="error">${esc(S.setupError)}</p>` : ""}</div>` },
      action("Disc image", "Choose", "A full ISO of the disc, as made by a disc dumper.", () => send({ type: "pickDisc" })),
    ];
    return [
      // Nothing about the install unless it's wrong: the page title names the game, Game folder opens where it is.
      ...(st.verified === false ? [{ html: `<div class="info"><p class="error">This copy isn't recognised as the USA release, so parts of the game may not work.</p></div>` }] : []),
      presetRow(),
      opt("text_language", "Text language", [["english", "English"], ["french", "Français"], ["german", "Deutsch"]],
        S.s.text_language === "french" || S.s.text_language === "german"
          ? "Menus, items, documents and subtitles from the European release. Voices stay English or Japanese."
          : "French and German come from the European release's text on the disc. Voices stay English or Japanese."),
      opt("movie_subtitles", "Movie subtitles", [["text", "Text language"], ["japanese", "Japanese"], ["off", "Off"]],
        "Subtitles over the movies, from a mod that has them (the HD pack's FMV Subtitles). Text language follows the setting above."),
      opt("skip_intro", "Skip intro", onOff, +S.s.skip_intro
        ? "On: the Capcom logo, violence warning and hard disk messages don't play. The game opens at the title screen."
        : "Off: the Capcom logo, violence warning and hard disk messages play, and A or Start skips each one."),
      action("Controls", "Open", "The keyboard keys for each button. A controller always works too.", () => go("controls")),
      action("Game folder", "Open", "Where the game's files were copied.", () => send({ type: "open", what: "game" })),
      action("Saves", "Open", "Your save games.", () => send({ type: "open", what: "saves" })),
      action("Xbox save", "Import", "Play on from a save made on a real Xbox: choose its save.dat (from E:\\UDATA\\43430001 on the console's hard disk). It replaces your save here, which is kept beside it as a backup.", () => send({ type: "importSave" })),
      action("Install again", "Choose", "Copy the game again from a disc image. Your saves stay.", () => send({ type: "pickDisc" })),
    ];
  } },
  randomizer: { name: "Randomizer", rows: () => {
    // Up to three runs, each a folder randomizer\<name>\ beside the launcher. onimusha.ini randomizer_run is the run
    // Play starts ("" = the normal game); randomizer_pick keeps the chosen run while the normal game is on. Cards: Enter
    // (A) or a click plays one; Left/Right or X/Y reach its buttons. An empty slot opens a new run's options in place.
    const r = S.rando || { runs: [] }, runs = (r.runs || []).slice().sort((x, y) => (x.made || 0) - (y.made || 0));
    const on = randoOn();
    const pick = runs.find(x => x.name === (S.s.randomizer_run || S.s.randomizer_pick)) || runs[0];
    const play = name => { set("randomizer_on", 1); set("randomizer_pick", name); set("randomizer_run", name); };
    const mode = v => { set("randomizer_on", v ? 1 : 0); set("randomizer_run", v && pick ? pick.name : ""); };
    if (on && pick && S.s.randomizer_run !== pick.name) play(pick.name);   // the chosen run went (deleted): the next one
    const sub = key => cardSub.page === page && cardSub.name === key ? cardSub.k : -1;
    const tags = x => [x.lc ? "Dark Realm & Ogre Tower" : "", x.fs ? "Fluorite-sanity" : "", x.kc ? "Don't Shuffle Consumables" : "", x.vs ? "Start with Vision Staff" : "",   /* runs made while the option existed */ x.dw ? "Door-sanity" : ""].filter(Boolean);
    const card = x => {
      const cur = on && pick === x, del = confirmDelete === x.name, k = sub(x.name);
      const subs = [
        { text: "Spoiler log", help: "Where every item went in this run (and every door, with Door-sanity). It gives the run away.", fn: () => send({ type: "open", what: "spoiler", run: x.name }) },
        { text: "Folder", help: "This run's files and its saves.", fn: () => send({ type: "open", what: "run", run: x.name }) },
        { text: del ? "Confirm delete" : "Delete", danger: true, help: del ? "Press again to move this run and its saves to the Recycle Bin." : "Moves this run and its saves to the Recycle Bin, which frees its slot. On a drive without one, Windows asks first.",
          fn: () => { if (del) { confirmDelete = null; send({ type: "randoDelete", run: x.name }); } else confirmDelete = x.name; } },
      ];
      const step = d => { cardSub = { page, name: x.name, k: Math.max(-1, Math.min(subs.length - 1, k + d)) }; confirmDelete = null; render(); };
      return { label: x.label || x.name, key: x.name, card: true, x, cur, chosen: pick === x, idle: !on, subs, k, tags: tags(x),
        help: k >= 0 ? subs[k].help : "", quiet: true,
        step, move: step, act: () => { if (k >= 0) subs[k].fn(); else if (!cur) play(x.name); } };
    };
    const chipRow = (key, label, desc, help, tag, even) => ({ label, chip: true, key, on: !!+S.s[key], desc, tag, even, cls: "nr chip" + (even ? " even" : ""),
      help, step: d => { if ((d > 0) !== !!+S.s[key]) set(key, +S.s[key] ? 0 : 1); }, act: () => set(key, +S.s[key] ? 0 : 1) });
    const form = slot => [
      { html: `<div class="nr-head">New run</div>` },
      { label: "Name", input: "rando-name", value: nameText, placeholder: "Same as the seed", cls: "nr", act: () => $("#rando-name").focus(),
        help: "What the run is called on its card. Leave it empty to use the seed." },
      { label: "Seed", input: "rando-seed", value: seedText, placeholder: "Random", dice: true, cls: "nr", act: () => $("#rando-seed").focus(),
        help: "The same seed and options always make the same run, so you can race a friend on it. Empty, or the dice, for a random one." },
      chipRow("randomizer_long_challenges", "Dark Realm & Ogre Tower", "Their floors can hold the items you need.",
        "The Dark Realm and the Ogre Tower join the shuffle and can hold what you need. Off, they keep their usual items.", "", false),
      chipRow("randomizer_fluorite_sanity", "Fluorite-sanity", "Items you need can be in unseen Fluorite spots.",
        "Hidden Fluorite can hold what you need even before you find the Vision Staff, so you may have to search the ground for sparkles you can't see.", "", true),
      chipRow("randomizer_keep_consumables", "Don't Shuffle Consumables", "Herbs, Medicine, ammo and jewels stay put.",
        "Herbs, Medicine, Talismans, jewels, arrows, bullets and Kunai stay where they are; key items, weapons, armor, Fluorite and documents move.", "", false),
      chipRow("randomizer_door_warp", "Door-sanity", "Doors lead to new rooms. Going back returns you.",
        "Doors lead to new places, and going back through one takes you back. Locked, sealed and puzzle doors, Kaede's parts, climbs and the final area stay as they are. Not played through yet.", "experimental", true),

  const foot = [x.saved ? `Saved ${day(x.saved)}` : "Not saved yet", t ? played(t) : ""].filter(Boolean).join(" · ");
  const btns = r.subs.map((b, k) => `<button data-sub="${k}" class="${[b.danger ? "danger" : "", r.k === k ? "sel" : ""].join(" ")}">${esc(b.text)}</button>`).join("");
  return `<div class="${cls} rcard${r.cur ? " on" : ""}${r.idle ? " idle" : ""}" data-i="${i}"><span class="rc-dot${r.chosen ? " chosen" : ""}"></span>
    <div class="rc-head"><b>${esc(r.label)}</b></div>
    <div class="rc-meta">${meta}</div>${prog}<div class="rc-foot"><span>${esc(foot)}</span><span class="rc-btns">${btns}</span></div></div>`;
}
// Updates come from the project's GitHub releases; a local build has none (S.update.enabled false).
const updateWaiting = () => S.update && S.update.enabled && S.update.state === "available";
function updateRows() {
  const u = S.update;
  if (!u || !u.enabled) return [];
  const send_ = () => send({ type: "update" });
  const unchecked = action("Updates", "Not checked", `Version ${S.version}. ${+S.s.check_updates ? "No answer from GitHub yet: still checking, offline, or the release isn't complete." : "Checking is off."}`, () => {});
  const row = {
    current: action("Updates", "Up to date", `Version ${S.version}. Checked each time the launcher starts.`, () => {}),
    available: action("Updates", `Update to ${u.version}`, `Version ${u.version} is out. It downloads from GitHub and restarts the launcher. Your game files, saves and settings stay.`, send_),
    downloading: action("Updates", `Downloading ${u.pct || 0}%`, `Downloading version ${u.version}.`, () => {}),
    installing: action("Updates", "Installing", `Installing version ${u.version}. The launcher restarts when it's done.`, () => {}),
    error: action("Updates", "Try again", u.text || "The update didn't finish.", send_),
  }[u.state] || unchecked;
  return [row, opt("check_updates", "Check for updates", onOff, "Looks for a new version on GitHub when the launcher starts. Nothing about you or your PC is sent.")];
}
function status() {
  if (!S.setup || !S.setup.ready) return "Choose your disc image to install the game.";
  if (updateWaiting()) return `Version ${S.update.version} is available: see About.`;
  return `${S.s.scale}× · ${[60, , 120, , 240][+S.s.frame_interpolation] || 60} fps · ${S.controller ? "controller connected" : "keyboard"}`;
}
// Long enough to read: an error is often a sentence or two (2.6 s for everything cut them off mid-read).
function say(text) { note = text; render(); clearTimeout(noteT); noteT = setTimeout(() => { note = ""; render(); }, Math.max(2600, 70 * text.length)); }

let artPick;   // the painting chosen for this run: every state message calls applyArt, the pick stays
function applyArt() {
  const a = S.art;
  const has = !!(a && a.logo);
  $("#logo").hidden = !has; $("#logo-text").hidden = has;
  if (has) $("#logo").style.backgroundImage = `url("${a.logo}")`;
  $("#title-jp").hidden = has;
  const pics = a ? [[a.hero2, "50% 40%"], [a.hero, "50% 40%"]].filter(p => p[0]) : [];
  if (pics.length) {
    if (!(artPick < pics.length)) artPick = Math.floor(Math.random() * pics.length);
    const p = pics[artPick];
    Object.assign($("#painting").style, { backgroundImage: `url("${p[0]}")`, backgroundPosition: p[1] });
  } else $("#painting").style.backgroundImage = "";
}

// ---- input ----
function go(p) { page = p; listening = null; confirmReset = false; confirmCheat = null; confirmDelete = null; render(); }
function moveFocus(d) {
  const live = rows.map((r, i) => r.label && !r.dim ? i : -1).filter(i => i >= 0);
  if (!live.length) return;
  const k = live.indexOf(focus[page]);
  focus[page] = live[Math.min(live.length - 1, Math.max(0, k + d))];
  confirmDelete = null; removeArmed = null; cardSub = {};   // an armed Delete / Remove doesn't wait for you to come back
  render();
}
// Esc and B: one way back, innermost first. A key being listened for, then anything armed or open (a card's
// button, the new-run form, a confirm), then out of Controls or About.
function back() {
  if (listening) { listening = null; return render(); }
  if (confirmReset || confirmDelete || confirmCheat || removeArmed || cardSub.k >= 0 || newSlot >= 0) {
    confirmReset = false; confirmDelete = null; confirmCheat = null; removeArmed = null; cardSub = {}; newSlot = -1; return render();

}
function stepFocused(d) { const r = rows[focus[page]]; if (r && !r.dim && r.step) { r.step(d); render(); } }
function moveFocused(d) { const r = rows[focus[page]]; if (r && r.move) r.move(d); }
function actFocused() { const r = rows[focus[page]]; if (r && !r.dim && r.act) { r.act(); render(); } }
// LB/RB, Q/E, PageUp/PageDown: the tabs, then About (the title bar's i) last, so it's reachable without a mouse.
const CYCLE = [...ORDER, "about"];
function turnPage(d) { const k = CYCLE.indexOf(page === "controls" ? "game" : page); go(CYCLE[k < 0 ? 0 : (k + d + CYCLE.length) % CYCLE.length]); }
function playOrInstall() { if (!S || S.running || packDownload() || $("#play").disabled) return; if (S.setup && S.setup.ready) send({ type: "play" }); else if (!(S.setup && S.setup.busy)) { go("game"); send({ type: "pickDisc" }); } }

document.addEventListener("click", e => {
  const n = e.target.closest("nav button");
  if (n) return go(n.dataset.page);
  if (e.target.closest("#about")) return go(page === "about" ? "game" : "about");
  if (e.target.closest("[data-back]")) return go("game");
  const w = e.target.closest(".winbtn");
  if (w) return send({ type: "window", action: w.dataset.act });
  const ck = e.target.closest("[data-cmdk]");   // a card button: the card is the focused row's
  if (ck) { const r = rows[focus[page]], c = r && r.cmds && r.cmds[+ck.dataset.cmdk]; if (c) { c.fn(); render(); } return; }
  const c = e.target.closest("[data-cmd]");
  if (c) { const row = c.closest("[data-i]"); return modCommand(c.dataset.cmd, row ? +row.dataset.i : undefined); }
  if (e.target.closest("[data-dice]")) { seedText = String(Math.floor(Math.random() * 1e6)).padStart(6, "0"); return render(); }
  const row = e.target.closest(".row");
  if (row && rows[+row.dataset.i] && rows[+row.dataset.i].card) {
    const r = rows[+row.dataset.i], sb = e.target.closest("[data-sub]");
    if (focus[page] !== +row.dataset.i || !sb) confirmDelete = null;
    focus[page] = +row.dataset.i;
    cardSub = { page, name: r.key, k: sb ? +sb.dataset.sub : -1 };
    rows = PAGES[page].rows();
    return actFocused();
  }
  if (row) {
    if (focus[page] !== +row.dataset.i) removeArmed = null;
    focus[page] = +row.dataset.i;
    const a = e.target.closest(".arrow");
    if (a) { if (!a.disabled) stepFocused(+a.dataset.step); return; }
    if (e.target.closest("[data-toggle]")) { const r = rows[focus[page]]; if (r && r.toggle && !r.dim) r.toggle(); return render(); }
    if (e.target.closest("[data-act]")) return actFocused();
    return render();
  }
  if (listening) { listening = null; render(); }
});
$("#list").addEventListener("mousemove", e => {
  if (PAGES[page].select) return;   // a list you select from by clicking, like a file list
  const row = e.target.closest(".row:not(.dim)");
  if (row && focus[page] !== +row.dataset.i && !listening) { focus[page] = +row.dataset.i; byMouse = true; render(); }
});
$("#list").addEventListener("input", e => { if (e.target.id === "mm-filter") { modFilter = e.target.value; render(); } else if (e.target.id === "rando-seed") seedText = e.target.value; else if (e.target.id === "rando-name") nameText = e.target.value; });
// Drag a mod up or down the list to change its load order.
let dragName = null;
$("#list").addEventListener("dragstart", e => { const r = e.target.closest(".mm-row"); if (!r) return; dragName = rows[+r.dataset.i].x.name; e.dataTransfer.effectAllowed = "move"; });
$("#list").addEventListener("dragover", e => {
  const r = e.target.closest(".mm-row"), t = r && rows[+r.dataset.i];
  if (!dragName || !t || t.kind !== "mod") return;
  e.preventDefault();
  document.querySelectorAll(".drop-above,.drop-below").forEach(el => el.classList.remove("drop-above", "drop-below"));
  const b = r.getBoundingClientRect();
  r.classList.add(e.clientY < b.top + b.height / 2 ? "drop-above" : "drop-below");
});
$("#list").addEventListener("drop", e => {
  const r = e.target.closest(".mm-row"), t = r && rows[+r.dataset.i];
  if (!dragName || !t || t.kind !== "mod") return;
  e.preventDefault();
  const all = S.mods, from = all.findIndex(x => x.name === dragName);   // the host's list: each modMove swaps in it
  let to = all.indexOf(t.x) + (r.classList.contains("drop-below") ? 1 : 0);
  if (to > from) to--;
  for (let k = from; k !== to; k += Math.sign(to - from)) send({ type: "modMove", name: dragName, d: String(Math.sign(to - from)) });
  all.splice(to, 0, all.splice(from, 1)[0]);

});
$("#list").addEventListener("dragend", () => { dragName = null; document.querySelectorAll(".drop-above,.drop-below").forEach(el => el.classList.remove("drop-above", "drop-below")); });
$("#play").addEventListener("click", playOrInstall);
$("#titlebar").addEventListener("mousedown", e => { if (!e.target.closest(".winbtn") && e.button === 0) send({ type: "drag" }); });
document.addEventListener("keydown", e => {
  if (e.target.id === "mm-filter" || e.target.classList.contains("field")) {   // typing in a box: only Esc, Enter and the up/down arrows leave it
    if (e.key === "Escape" || e.key === "ArrowDown" || e.key === "Enter") { e.preventDefault(); e.target.blur(); if (e.key === "ArrowDown" && e.target.id !== "mm-filter") moveFocus(1); }

  const map = { ArrowUp: () => moveFocus(-1), ArrowDown: () => moveFocus(1), ArrowLeft: () => stepFocused(-1), ArrowRight: () => stepFocused(1),
    Enter: actFocused, " ": actFocused, PageUp: () => turnPage(-1), PageDown: () => turnPage(1), q: () => turnPage(-1), e: () => turnPage(1),
    Escape: back };

// controller buttons, forwarded by the launcher
const PAD = { up: () => moveFocus(-1), down: () => moveFocus(1), left: () => stepFocused(-1), right: () => stepFocused(1), a: actFocused,
  b: back,

// ---- messages from the launcher ----
// What arrives in its own message, not in the state (the install's error, the update's text and percentage): kept here,

let setupErr = "", updMsg = null;
function onHost(m) {
  if (m.type === "state") {

    S = m;
    if (setupErr) S.setupError = setupErr;
    if (updMsg && S.update && S.update.state === updMsg.state) Object.assign(S.update, { pct: updMsg.pct, text: updMsg.text });
    if (presetAnswers > 0 && --presetAnswers > 0) return;

    applyArt(); render();
  } else if (m.type === "progress") { S.setupError = setupErr = ""; S.setup = Object.assign({}, S.setup, { busy: true, pct: m.pct, file: m.file, done: m.done, total: m.total }); if (page === "game" || page === "__ob") render(); }
  else if (m.type === "toast") say(m.text);
  else if (m.type === "setupError") { S.setupError = setupErr = m.text; render(); }
  else if (m.type === "randoMade") { seedText = nameText = ""; }
  else if (m.type === "running") { S.running = m.running; render(); }
  else if (m.type === "pad") { S.controller = m.connected; render(); }
  else if (m.type === "packpct") { if (S.pack) { S.pack.pct = m.pct; render(); } }   // every page: Play shows the percentage too
  else if (m.type === "update") { updMsg = m; S.update = Object.assign({}, S.update, { state: m.state, version: m.version, pct: m.pct, text: m.text }); render(); }
  else if (m.type === "button" && !listening || m.type === "button" && m.b === "b") { const f = PAD[m.b]; if (f) f(); }
}
if (host) { host.addEventListener("message", e => onHost(e.data)); send({ type: "ready" }); }
