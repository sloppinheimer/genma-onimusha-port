# Push a tag like v0.8 to publish a release: builds the port on Windows and attaches
# GenmaOnimusha-<version>.zip and its .sha256, which the launcher's updater downloads; then builds the native Linux
# port and attaches GenmaOnimusha-<version>-linux.tar.gz and its .sha256 to the same release.
# The packages hold only files built here, their licences and the repo's mods/ folder: never anything from the game disc.
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-2022   # a fixed image (VS 2022), not whatever windows-latest is that day
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1 (Node 24), by commit: a tag can be moved

      - name: WebView2 SDK (NuGet, pinned)
        run: |
          $nupkg = "$env:RUNNER_TEMP\webview2.zip"
          Invoke-WebRequest https://www.nuget.org/api/v2/package/Microsoft.Web.WebView2/1.0.4258.31 -OutFile $nupkg
          $hash = (Get-FileHash $nupkg -Algorithm SHA256).Hash
          if ($hash -ne '56F7F4B8BF9AEE4B8EFEFBBDD4F67D5F74EBD1B100ED0806DA71BF76AF481AA9') { throw "WebView2 SDK hash mismatch: $hash" }
          Expand-Archive $nupkg third_party/webview2/pkg

      - name: Build
        env:
          TAG: ${{ github.ref_name }}   # through the environment, never pasted into the script: a tag name could hold code
        run: |
          cmake --version
          $version = $env:TAG.TrimStart('v')
          cmake -S . -B build -A Win32 "-DONI_VERSION=$version" "-DONI_UPDATE_REPO=${{ github.repository }}"
          cmake --build build --config RelWithDebInfo
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Self-tests
        run: |
          build/RelWithDebInfo/selftest.exe
          if ($LASTEXITCODE) { throw "selftest failed" }
          python -I tools/xbe_tool.py selftest
          if ($LASTEXITCODE) { throw "xbe_tool selftest failed" }

      - name: Package
        run: |
          # The build folder is already laid out like the install (src/host/layout.h): the launcher on top, the rest in folders.
          $files = 'GenmaOnimusha.exe', 'bin/onimusha.exe', 'bin/onimusha_host.dll', 'bin/SDL3.dll',
                   'bin/licenses/SDL3-LICENSE.txt', 'bin/licenses/KabutoSans-OFL.txt', 'bin/licenses/KabutoSans-KosugiMaru-LICENSE.txt',
                   'bin/licenses/THIRD-PARTY.txt'
          foreach ($f in $files) {
            New-Item -ItemType Directory -Force (Split-Path "stage/$f") | Out-Null
            Copy-Item "build/RelWithDebInfo/$f" "stage/$f"
          }
          Copy-Item README.md stage/
          Copy-Item LICENSE stage/LICENSE.txt
          Copy-Item third_party/webview2/pkg/LICENSE.txt stage/bin/licenses/WebView2-LICENSE.txt
          Copy-Item build/RelWithDebInfo/mods stage/ -Recurse   # the port's own mod folders and readme, copied whole
          # Allow-list check, by path: anything unexpected in the package (say, a texture dump or a test mod that
          # ended up in mods/) fails the release. The repo's tracked mods/ files are allowed by name, so adding one there
          # needs no edit here.
          $allowed = $files + 'README.md', 'LICENSE.txt', 'bin/licenses/WebView2-LICENSE.txt' + @(git ls-files mods)
          $stage = (Resolve-Path stage).Path
          $extra = Get-ChildItem stage -Recurse -File | % { $_.FullName.Substring($stage.Length + 1).Replace('\', '/') } | Where-Object { $allowed -notcontains $_ }
          if ($extra) { throw "Unexpected files in the package: $($extra -join ', ')" }
          $zip = "GenmaOnimusha-$env:VERSION.zip"
          Compress-Archive stage/* $zip
          (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower() + "  $zip" | Out-File -Encoding ascii "$zip.sha256"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          $zip = "GenmaOnimusha-$env:VERSION.zip"
          # a tag with a suffix (v0.9-beta) is a pre-release: GitHub's "latest", which the launcher checks, skips it
          $extra = @()
          if ($env:TAG -match '-') { $extra += '--prerelease' }
          gh release create $env:TAG $zip "$zip.sha256" --title "Genma Xcorcised $env:VERSION" --generate-notes @extra

  # The native Linux port: one 32-bit executable and the libraries it loads (docs/building.md, Linux), packed by
  # tools/linux/package.sh, which checks what goes in. After the Windows job: it adds to the release that one made.
  linux:
    needs: release
    runs-on: ubuntu-22.04   # what tools/linux/deps.sh is written for; its 32-bit X11 libraries go in the package
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1 (Node 24), by commit: a tag can be moved

      - name: Packages
        run: |
          # tools/linux/deps.sh's list (its header), and patchelf for package.sh
          sudo dpkg --add-architecture i386
          sudo apt-get update -q
          sudo apt-get install -y -q gcc-multilib g++-multilib cmake ninja-build curl libvulkan-dev:i386 \
            libx11-dev:i386 libxext-dev:i386 libxcursor-dev:i386 libxi-dev:i386 libxfixes-dev:i386 libxrandr-dev:i386 \
            libxss-dev:i386 libxtst-dev:i386 libxinerama-dev:i386 libxkbcommon-dev:i386 libxcb1-dev:i386 \
            libwayland-dev:i386 libdecor-0-dev:i386 libegl-dev:i386 libgl-dev:i386 libgbm-dev:i386 libdrm-dev:i386 \
            libasound2-dev:i386 libpulse-dev:i386 libpipewire-0.3-dev:i386 libdbus-1-dev:i386 libibus-1.0-dev:i386 \
            libudev-dev:i386 libusb-1.0-0-dev:i386 flex bison libjson-perl nasm patchelf \
            qt6-base-dev qt6-webengine-dev qt6-webengine-dev-tools libqt6webchannel6-dev libqt6opengl6-dev libgl-dev   # the launcher: 64-bit
          python3 -m pip install --user -q meson==1.12.1   # DXVK needs a newer one than 22.04's
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          sudo install -d -o "$USER" /opt/oni   # deps.sh's folders (linux.cmake's default ONI_LINUX_DEPS), and the cache's

      # deps.sh's libraries are built once per version of deps.sh. Cached with them: the licences package.sh reads
      # from their sources (the sources themselves are 1.4 GB).
      - name: Dependencies cache
        id: deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6.1.0, by commit
        with:
          key: linux-deps-ubuntu-22.04-${{ hashFiles('tools/linux/deps.sh') }}
          path: |
            /opt/oni/i386
            /opt/oni/src/SDL/LICENSE.txt
            /opt/oni/src/dxvk/LICENSE
            /opt/oni/src/dxvk/subprojects/*/LICENSE
            /opt/oni/src/FAudio/LICENSE
            /opt/oni/src/vkd3d-*/COPYING
            /opt/oni/src/vkd3d-*/AUTHORS
            /opt/oni/src/vkd3d-*/LICENSE
            /opt/oni/src/ffmpeg-*/LICENSE.md
            /opt/oni/src/ffmpeg-*/COPYING.LGPLv2.1

      - name: Dependencies
        if: steps.deps.outputs.cache-hit != 'true'
        run: bash tools/linux/deps.sh /opt/oni/i386 /opt/oni/src

      - name: Build
        env:
          TAG: ${{ github.ref_name }}   # through the environment, as above
        run: |
          cmake --version
          # the game (32-bit) and the launcher (64-bit, the system's Qt 6), configured as a release: no debug switches
          cmake -S . -B build-linux -G Ninja -DCMAKE_C_FLAGS=-m32 -DCMAKE_CXX_FLAGS=-m32 -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            "-DONI_VERSION=${TAG#v}" "-DONI_UPDATE_REPO=${{ github.repository }}"
          ninja -C build-linux
          cmake -S . -B build-launcher -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            "-DONI_VERSION=${TAG#v}" "-DONI_UPDATE_REPO=${{ github.repository }}"
          ninja -C build-launcher

      - name: Package
        env:
          TAG: ${{ github.ref_name }}   # through the environment, as above
        run: bash tools/linux/package.sh "${TAG#v}" dist build-linux /opt/oni/src build-launcher/out/GenmaOnimusha

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          tar="dist/GenmaOnimusha-${TAG#v}-linux.tar.gz"
          gh release upload "$TAG" "$tar" "$tar.sha256"
